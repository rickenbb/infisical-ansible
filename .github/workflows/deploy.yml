name: Deploy nginx through Infisical PAM
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-pam-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.act }}
    uses: ./.github/workflows/ansible-pam.yml
    with:
      inventory: example/inventory.infisical.yml
      playbook: example/nginx.yml
      infisical-domain: ${{ vars.INFISICAL_DOMAIN || 'https://infisical.zh.rickenbacher.tech' }}
      environment: demo
      reason: GitHub Actions nginx demo ${{ github.sha }}
    secrets:
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}

  # act prepares remote actions even when their step condition is false.
  # Keep its native host job free of remote actions and share make deploy.
  local-deploy:
    if: ${{ github.event.act }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || 'https://infisical.zh.rickenbacher.tech' }}
      PAM_REASON: Local act nginx demo
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.LOCAL_WORKSPACE || github.workspace }}
    steps:
      - name: Test plugin
        run: make test
      - name: Validate project inputs
        run: make deploy ARGS=--validate-only
      - name: Deploy nginx
        if: ${{ env.LOCAL_DRY_RUN != 'true' }}
        env:
          INFISICAL_AUTH_METHOD: universal-auth
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
        run: make deploy
